# AceCamp 文章抓取配置
base_url: "https://www.acecamptech.com"
search_url: "https://www.acecamptech.com/search"
login_url: "https://www.acecamptech.com/login"

# 分类页 URL（直接从对应标签页抓取）
category_urls:
  纪要: "https://www.acecamptech.com/search?type=minutes"
  观点: "https://www.acecamptech.com/search?type=articles"

# 文章保存目录
output_dir: "articles"

# 已下载文章的记录文件
history_file: "data/downloaded.json"

# 浏览器设置
browser:
  headless: true
  timeout: 30000  # 页面加载超时 (ms)
  wait_after_load: 3000  # 页面加载后等待时间 (ms)，确保SPA渲染完成

# 请求间隔（秒），防止触发反爬机制
scrape_delay_min: 3
scrape_delay_max: 8

# 日志
log_file: "logs/scraper.log"
